# 按 Zsh 启动阶段声明完整、唯一的装配顺序。

[profile]
sources = [
  "lib/environment.zsh",
  "plugins/homebrew/profile.zsh",
  "plugins/nvm/profile.zsh",
]

[interactive]
sources = [
  "settings.zsh",
  "lib/environment.zsh",
  "plugins/zim/interactive.zsh",
  "plugins/nvm/interactive.zsh",
  "plugins/proxy/interactive.zsh",
  "lib/history.zsh",
  "lib/options.zsh",
  "lib/keybindings.zsh",
  "lib/aliases.zsh",
  "lib/functions.zsh",
  "lib/listing.zsh",
  "themes/personal.zsh",
]
