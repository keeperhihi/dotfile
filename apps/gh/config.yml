# 当前 config schema 的版本。
version: 1
# 执行 Git 操作时使用的协议；支持 ssh 和 https。
git_protocol: https
# gh 创建 issue、pull request 等内容时使用的 editor；留空则使用环境设置。
editor:
# 何时显示交互式 prompt；这是全局配置，不能按 hostname 覆盖。
prompt: enabled
# 基于 editor 的交互式 prompt 偏好；这是全局配置，不能按 hostname 覆盖。
prefer_editor_prompt: disabled
# 命令输出使用的 pager，例如 "less"；留空则使用环境设置，设为 "cat" 可禁用 pager。
pager:
# alias 用于为 gh 命令创建简称。
aliases:
    co: pr checkout
# 发送 HTTP 连接时使用的 Unix socket 路径；留空则由 net/http.DefaultTransport 处理。
http_unix_socket:
# gh 打开 URL 时使用的 browser；留空则使用环境设置。
browser:
# 是否在支持 truecolor 的终端中使用 RGB 十六进制颜色显示 label。
color_labels: disabled
# 是否使用可自定义的 4-bit accessible colors。
accessible_colors: disabled
# 是否使用 accessible prompter。
accessible_prompter: disabled
# 是否使用动画 spinner 显示进度；禁用后改用文字进度提示。
spinner: enabled
